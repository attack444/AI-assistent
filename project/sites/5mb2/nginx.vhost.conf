# AI Helper — 5mb2 → 5mb2.ru (HTTP; SSL позже)
# Важно: /api → панель AI Helper, иначе виджет чата на домене молчит.
server {
    listen 80;
    listen [::]:80;
    server_name 5mb2.ru www.5mb2.ru;

    root /var/ai-helper/sites/5mb2;
    index index.php index.html index.htm;
    client_max_body_size 200M;

    # Публичный API чата / деплоя (тот же, что у панели на :80 /api/)
    location /api/ {
        proxy_pass         http://127.0.0.1:8502/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Опционально: витрина /sites/ai с того же домена
    location /sites/ {
        root /var/ai-helper;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }
}
