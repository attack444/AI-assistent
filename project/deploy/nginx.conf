# AI Helper — Nginx (панель + API + сайты + PHP)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200M;

    location /api/ {
        proxy_pass         http://127.0.0.1:8502/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Публичные превью p* — opaque origin (CSP sandbox без allow-same-origin),
    # чтобы JS деплоя не читал localStorage панели на том же host.
    location ~ ^/sites/(p[a-z0-9]{7,15})(/.*)?$ {
        root /var/ai-helper;
        index index.html index.htm;
        try_files $uri $uri/ =404;

        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-modals" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        # PHP на публичных превью не обслуживаем
        location ~ \.php(?:$|/) {
            return 403;
        }
    }

    # /sites/mysite/ → /var/ai-helper/sites/mysite/ (+ WP permalinks)
    location /sites/ {
        root /var/ai-helper;
        index index.php index.html index.htm;
        try_files $uri $uri/ @wp_sites;

        location ~ \.php(?:$|/) {
            root /var/ai-helper;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
        }
    }

    location @wp_sites {
        # /sites/name/pretty-permalink → that site's index.php
        rewrite ^/sites/([^/]+)(/.*)?$ /sites/$1/index.php?$args last;
    }

    # Legacy Streamlit отключён снаружи (см. ENABLE_STREAMLIT / bind 127.0.0.1).
    location /legacy/ {
        return 404;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }
}
