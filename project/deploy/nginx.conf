# AI Helper — Nginx (панель + API + сайты + PHP)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200M;

    location /api/ {
        proxy_pass         http://127.0.0.1:8502/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # Public preview sites (p + hex) — unique opaque origin via CSP sandbox so
    # attacker HTML/JS cannot read panel localStorage (ai-helper-token) on /
    location ~ ^/sites/(?<pubsite>p[a-z0-9]{7,15})(/.*)?$ {
        root /var/ai-helper;
        index index.html index.htm;
        try_files $uri $uri/ =404;

        add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-popups allow-modals allow-downloads; default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        # No PHP for public static previews
        location ~ ^/sites/p[a-z0-9]{7,15}/.*\.php(?:$|/) {
            return 404;
        }
    }

    # /sites/mysite/ → /var/ai-helper/sites/mysite/ (+ WP permalinks)
    location /sites/ {
        root /var/ai-helper;
        index index.php index.html index.htm;
        try_files $uri $uri/ @wp_sites;

        location ~ \.php(?:$|/) {
            root /var/ai-helper;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Drop client-supplied PHP_VALUE / PHP_ADMIN_VALUE (FastCGI RCE vector)
            fastcgi_param PHP_VALUE "";
            fastcgi_param PHP_ADMIN_VALUE "";
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
        }
    }

    location @wp_sites {
        # /sites/name/pretty-permalink → that site's index.php
        rewrite ^/sites/([^/]+)(/.*)?$ /sites/$1/index.php?$args last;
    }

    location /legacy/ {
        proxy_pass         http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }
}
