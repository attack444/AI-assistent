# AI Helper — Nginx конфигурация
# Работает по IP (до покупки домена)
# После покупки домена: замени _ на твой-домен.ru

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;   # любой хост / IP

    client_max_body_size 50M;

    # ── API ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8502/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # SSE (streaming) поддержка
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # ── Chat (Streamlit) ─────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    # ── Статические файлы для деплоев ────────────────────────────
    location /sites/ {
        alias /var/ai-helper/sites/;
        autoindex off;
        try_files $uri $uri/ =404;
    }
}

