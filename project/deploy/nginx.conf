# AI Helper — Nginx (панель + API + сайты + PHP)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 200M;

    location /api/ {
        proxy_pass         http://127.0.0.1:8502/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    }

    # /sites/mysite/ → /var/ai-helper/sites/mysite/ (+ WP permalinks)
    location /sites/ {
        root /var/ai-helper;
        index index.php index.html index.htm;
        try_files $uri $uri/ @wp_sites;

        location ~ \.php(?:$|/) {
            root /var/ai-helper;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 300s;
        }
    }

    location @wp_sites {
        # /sites/name/pretty-permalink → that site's index.php
        rewrite ^/sites/([^/]+)(/.*)?$ /sites/$1/index.php?$args last;
    }

    location /legacy/ {
        proxy_pass         http://127.0.0.1:8501/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    # Панель NeoBrain (Next basePath=/console)
    location = /console {
        return 302 /console/;
    }
    location /console/ {
        proxy_pass         http://127.0.0.1:3000/console/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }

    location = / {
        return 302 /console/;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000/console/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 600s;
    }
}
