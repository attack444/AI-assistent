services:

  # ── AI Helper API + Streamlit (legacy chat) ─────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ai-helper-app
    restart: unless-stopped
    # Only loopback: host nginx proxies /api and /legacy. Never publish to 0.0.0.0.
    ports:
      - "127.0.0.1:8501:8501"   # Streamlit (legacy)
      - "127.0.0.1:8502:8502"   # REST API
    volumes:
      - ai_helper_data:/root/.ai-helper
      - /var/ai-helper/sites:/opt/sites
      - /var/ai-helper/sites:/var/ai-helper/sites
      # Исходники панели/API — чтобы DeepSeek (чат site=server) правил бэкенд
      - /opt/ai-helper:/opt/ai-helper
    env_file:
      # Secrets (PANEL_PASSWORD, SECRET_KEY, DB passwords) come ONLY from here.
      # Do not re-declare them under environment: with ${VAR:-} — compose host
      # interpolation does not read this env_file and would wipe them to empty/defaults.
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - AI_HELPER_API_HOST=0.0.0.0
      - AI_HELPER_API_PORT=8502
      - SITES_ROOT=/opt/sites
      - HOST_SITES_PATH=/var/ai-helper/sites
      - AI_HELPER_PROJECT=/opt/ai-helper/project
      - VPS_PUBLIC_IP=${VPS_PUBLIC_IP:-80.78.248.195}
      - WORKSPACE_ROOTS=/opt/sites,/var/ai-helper/sites,/opt/ai-helper,/workspace
      - MAX_UPLOAD_BYTES=2147483648
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - FREE_LLM_MODEL=${FREE_LLM_MODEL:-qwen2.5:1.5b}
      - LLM_PREFER_FREE=${LLM_PREFER_FREE:-1}
      - FAST_LLM_MODEL=${FAST_LLM_MODEL:-qwen2.5:1.5b}
      - PUBLIC_WIDGET_GUEST=${PUBLIC_WIDGET_GUEST:-1}
      - PUBLIC_AUTH_REQUIRED=${PUBLIC_AUTH_REQUIRED:-1}
      - TRUSTED_PROXIES=127.0.0.1,::1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    depends_on:
      - ollama
    networks:
      - ai-net

  # ── Ollama: бесплатная локальная модель ─────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ai-helper-ollama
    restart: unless-stopped
    # No host ports — only reachable on ai-net (app → http://ollama:11434)
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-net

  # ── Next.js control panel (файлы / сайты / чат) ─────────────
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: ai-helper-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_INTERNAL_URL=http://app:8502
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - app
    networks:
      - ai-net

  # ── PHP-FPM (WordPress / обычный хостинг) ───────────────────
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ai-helper-php
    restart: unless-stopped
    # Loopback only — host nginx uses 127.0.0.1:9000. Never publish on 0.0.0.0
    # (public FastCGI enables unauthenticated RCE via auto_prepend_file).
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/ai-helper/sites:/var/ai-helper/sites
    networks:
      - ai-net

  # ── MySQL для WordPress ─────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ai-helper-mysql
    restart: unless-stopped
    # Loopback only for host-side WP tooling; not reachable from the internet.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD / MYSQL_USER / MYSQL_DATABASE from ../.env
    env_file:
      - ../.env
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ai-helper-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aihelper}
      POSTGRES_USER: ${POSTGRES_USER:-aihelper}
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-aihelper}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-helper-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-net

volumes:
  ai_helper_data:
  postgres_data:
  redis_data:
  mysql_data:
  ollama_data:

networks:
  ai-net:
    driver: bridge
