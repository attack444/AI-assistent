# Секреты и пароли — из project/.env через env_file.
# Запуск: docker compose --env-file ../.env -f docker-compose.prod.yml up -d
services:

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ai-helper-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8502"
      - "127.0.0.1:8501:8501"
    volumes:
      - ai_helper_data:/root/.ai-helper
      - /var/ai-helper/sites:/opt/sites
      - /var/ai-helper/sites:/var/ai-helper/sites
      - /opt/ai-helper:/opt/ai-helper
    env_file:
      - ../.env
    environment:
      # Только инфраструктура (не секреты — их даёт env_file)
      - PYTHONUNBUFFERED=1
      - AI_HELPER_API_HOST=0.0.0.0
      - AI_HELPER_API_PORT=8502
      - SITES_ROOT=/opt/sites
      - HOST_SITES_PATH=/var/ai-helper/sites
      - AI_HELPER_PROJECT=/opt/ai-helper/project
      - WORKSPACE_ROOTS=/opt/sites,/var/ai-helper/sites,/opt/ai-helper,/workspace
      - MAX_UPLOAD_BYTES=2147483648
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - OLLAMA_HOST=http://ollama:11434
      - ENABLE_STREAMLIT=0
    depends_on:
      - ollama
    networks:
      - ai-net

  ollama:
    image: ollama/ollama:latest
    container_name: ai-helper-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        PANEL_BASE_PATH: ${PANEL_BASE_PATH:-/console}
    container_name: ai-helper-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_INTERNAL_URL=http://app:8502
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - PANEL_BASE_PATH=${PANEL_BASE_PATH:-/console}
    depends_on:
      - app
    networks:
      - ai-net

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ai-helper-php
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/ai-helper/sites:/var/ai-helper/sites
    networks:
      - ai-net

  mysql:
    image: mysql:8.0
    container_name: ai-helper-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - ../.env
    environment:
      # Имена переменных MySQL image; значения из env_file (не ${:-default} из deploy/)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    profiles: ["extra"]
    image: postgres:16-alpine
    container_name: ai-helper-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ../.env
    networks:
      - ai-net

  redis:
    profiles: ["extra"]
    image: redis:7-alpine
    container_name: ai-helper-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-net

volumes:
  ai_helper_data:
  postgres_data:
  redis_data:
  mysql_data:
  ollama_data:

networks:
  ai-net:
    driver: bridge
