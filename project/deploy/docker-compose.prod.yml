services:

  # ── AI Helper API + Streamlit (legacy chat) ─────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ai-helper-app
    restart: unless-stopped
    ports:
      - "8501:8501"   # Streamlit (legacy)
      - "8502:8502"   # REST API
    volumes:
      - ai_helper_data:/root/.ai-helper
      - /var/ai-helper/sites:/opt/sites
      - /var/ai-helper/sites:/var/ai-helper/sites
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - AI_HELPER_API_HOST=0.0.0.0
      - AI_HELPER_API_PORT=8502
      - SITES_ROOT=/opt/sites
      - HOST_SITES_PATH=/var/ai-helper/sites
      - WORKSPACE_ROOTS=/opt/sites,/var/ai-helper/sites,/opt/ai-helper,/workspace
      - MAX_UPLOAD_BYTES=2147483648
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
      - SECRET_KEY=${SECRET_KEY:-dev-insecure-change-me}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://localhost:11434}
    networks:
      - ai-net

  # ── Next.js control panel (файлы / сайты / чат) ─────────────
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: ai-helper-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - API_INTERNAL_URL=http://app:8502
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - app
    networks:
      - ai-net

  # ── PHP-FPM (WordPress / обычный хостинг) ───────────────────
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: ai-helper-php
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/ai-helper/sites:/var/ai-helper/sites
    networks:
      - ai-net

  # ── MySQL для WordPress ─────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ai-helper-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-смени_root_пароль}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-смени_wp_пароль}
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-смени_root_пароль}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ai-helper-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aihelper}
      POSTGRES_USER: ${POSTGRES_USER:-aihelper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    networks:
      - ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aihelper}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-helper-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ai-net

volumes:
  ai_helper_data:
  postgres_data:
  redis_data:
  mysql_data:

networks:
  ai-net:
    driver: bridge
