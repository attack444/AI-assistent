# =============================================================================
#  Nginx: два домена на одном VPS → один web-контейнер (порт 8080).
#  Nginx передаёт заголовок Host, а web по нему решает, какой сайт показать.
#  Файл монтируется в /etc/nginx/conf.d (см. docker-compose.yml).
#
#  SSL: после получения сертификатов (certbot) добавь server{ listen 443 ssl; ... }
#  и редирект с 80 на 443. Пути к сертификатам подставь свои.
# =============================================================================

# Ограничитель частоты запросов на уровне nginx (первый барьер против флуда).
limit_req_zone $binary_remote_addr zone=nb_rl:10m rate=20r/s;

# --- SaaS: neobrain --------------------------------------------------------
server {
  listen 80;
  server_name neobrain.local neobrain.ru www.neobrain.ru;

  client_max_body_size 10m;

  location / {
    limit_req zone=nb_rl burst=40 nodelay;
    proxy_pass http://web:8080;
    proxy_set_header Host $host;                 # web увидит "neobrain.*"
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# --- Студия игр: 5mb2 ------------------------------------------------------
server {
  listen 80;
  server_name 5mb2.local 5mb2.ru www.5mb2.ru;

  client_max_body_size 10m;

  location / {
    limit_req zone=nb_rl burst=40 nodelay;
    proxy_pass http://web:8080;
    proxy_set_header Host $host;                 # web увидит "5mb2.*" → покажет игры
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
